<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Sufism Blog</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-moon"></i>
            <h3>Admin Panel</h3>
        </div>
        <ul class="sidebar-menu">
            <li class="active">
                <a href="#dashboard" onclick="showSection('dashboard')">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
            </li>
            <li>
                <a href="#articles" onclick="showSection('articles')">
                    <i class="fas fa-newspaper"></i> All Articles
                </a>
            </li>
            <li>
                <a href="#add-article" onclick="showSection('add-article')">
                    <i class="fas fa-plus-circle"></i> Add New Article
                </a>
            </li>
            <li>
                <a href="index.html" target="_blank">
                    <i class="fas fa-eye"></i> View Website
                </a>
            </li>
            <li>
                <a href="#" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Bar -->
        <div class="topbar">
            <h2 id="pageTitle">Dashboard</h2>
            <div class="user-info">
                <i class="fas fa-user-circle"></i>
                <span id="adminName">Admin</span>
            </div>
        </div>

        <!-- Dashboard Section -->
        <section id="dashboard" class="content-section active">
            <div class="stats-container">
                <div class="stat-card">
                    <i class="fas fa-newspaper"></i>
                    <div class="stat-info">
                        <h3 id="totalArticles">0</h3>
                        <p>Total Articles</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-eye"></i>
                    <div class="stat-info">
                        <h3 id="totalViews">0</h3>
                        <p>Total Views</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-clock"></i>
                    <div class="stat-info">
                        <h3 id="recentPosts">0</h3>
                        <p>Recent Posts</p>
                    </div>
                </div>
            </div>

            <div class="recent-articles">
                <h3>Recent Articles</h3>
                <div id="recentArticlesList"></div>
            </div>
        </section>

        <!-- All Articles Section -->
        <section id="articles" class="content-section">
            <div class="section-header">
                <h3>All Articles</h3>
                <button onclick="showSection('add-article')" class="btn-primary">
                    <i class="fas fa-plus"></i> Add New
                </button>
            </div>
            
            <div id="articlesTable" class="articles-table"></div>
        </section>

        <!-- Add/Edit Article Section -->
        <section id="add-article" class="content-section">
            <div class="form-container">
                <h3 id="formTitle">Add New Article</h3>
                <form id="articleForm">
                    <input type="hidden" id="articleId">
                    
                    <div class="form-group">
                        <label>Article Title *</label>
                        <input type="text" id="title" placeholder="Enter article title" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Category *</label>
                            <select id="category" required>
                                <option value="">Select Category</option>
                                <option value="Spirituality">Spirituality</option>
                                <option value="Practices">Practices</option>
                                <option value="Wisdom">Wisdom</option>
                                <option value="Masters">Masters</option>
                                <option value="Teachings">Teachings</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Author Name *</label>
                            <input type="text" id="author" placeholder="Author name" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Article Image URL *</label>
                        <input type="url" id="imageUrl" placeholder="https://example.com/image.jpg" required>
                        <small>Paste image URL from Unsplash, Pexels, or any image hosting service</small>
                    </div>

                    <div class="form-group">
                        <label>Short Description (Excerpt) *</label>
                        <textarea id="excerpt" rows="3" placeholder="Brief description of the article..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label>Full Article Content *</label>
                        <textarea id="content" rows="15" placeholder="Write your full article here..." required></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-success">
                            <i class="fas fa-save"></i> Save Article
                        </button>
                        <button type="button" onclick="resetForm()" class="btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="firebase.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
