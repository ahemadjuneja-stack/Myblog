<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUFISM Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .admin-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        
        h1 {
            color: #4CAF50;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        
        textarea {
            height: 150px;
            resize: vertical;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        button:hover {
            background: #45a049;
        }
        
        .message {
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .login-screen, .admin-screen {
            display: none;
        }
        
        .active {
            display: block;
        }
        
        .logout-btn {
            background: #f44336;
            width: auto;
            padding: 10px 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="admin-box login-screen active">
    <h1>🔐 SUFISM ADMIN</h1>
    
    <div class="input-group">
        <label>Username:</label>
        <input type="text" id="username" value="admin">
    </div>
    
    <div class="input-group">
        <label>Password:</label>
        <input type="password" id="password" value="sufism123">
    </div>
    
    <button onclick="login()">LOGIN</button>
    
    <div class="message error" id="errorMsg" style="display: none;">
        ❌ Wrong username or password!
    </div>
    
    <div class="message success" id="successMsg" style="display: none;">
        ✅ Login successful!
    </div>
    
    <div style="margin-top: 30px; padding: 15px; background: #f5f5f5; border-radius: 8px; text-align: left;">
        <p><strong>Login Details:</strong></p>
        <p>Username: <strong>admin</strong></p>
        <p>Password: <strong>sufism123</strong></p>
    </div>
</div>

<!-- ADMIN SCREEN -->
<div id="adminScreen" class="admin-box admin-screen">
    <h1>🎉 ADMIN PANEL</h1>
    
    <div style="text-align: left; margin-bottom: 30px;">
        <p><strong>Logged in as:</strong> admin</p>
    </div>
    
    <div class="input-group">
        <label>Content Type:</label>
        <select id="contentType">
            <option value="quote">Sufi Quote</option>
            <option value="poem">Sufi Poem</option>
            <option value="teaching">Teaching</option>
        </select>
    </div>
    
    <div class="input-group">
        <label>Author/Title:</label>
        <input type="text" id="author" placeholder="e.g., Rumi, Kabir">
    </div>
    
    <div class="input-group">
        <label>Content:</label>
        <textarea id="content" placeholder="Enter content here..."></textarea>
    </div>
    
    <button onclick="saveContent()">💾 SAVE CONTENT</button>
    
    <button class="logout-btn" onclick="logout()">🚪 LOGOUT</button>
    
    <div class="message success" id="saveSuccess" style="display: none;">
        ✅ Content saved successfully!
    </div>
</div>

<script>
// 🔐 SIMPLE LOGIN SYSTEM
function login() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    
    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';
    
    // Check credentials
    if(username === "admin" && password === "sufism123") {
        successMsg.style.display = 'block';
        
        // Switch to admin screen after 1 second
        setTimeout(() => {
            document.getElementById('loginScreen').classList.remove('active');
            document.getElementById('adminScreen').classList.add('active');
        }, 1000);
        
    } else {
        errorMsg.style.display = 'block';
    }
}

function logout() {
    if(confirm("Are you sure you want to logout?")) {
        document.getElementById('adminScreen').classList.remove('active');
        document.getElementById('loginScreen').classList.add('active');
        
        // Clear fields
        document.getElementById('author').value = '';
        document.getElementById('content').value = '';
        
        // Hide messages
        document.getElementById('saveSuccess').style.display = 'none';
    }
}

function saveContent() {
    const author = document.getElementById('author').value;
    const content = document.getElementById('content').value;
    const contentType = document.getElementById('contentType').value;
    
    if(!author.trim() || !content.trim()) {
        alert("Please fill in all fields!");
        return;
    }
    
    // Show saving message
    const saveBtn = document.querySelector('#adminScreen button:first-of-type');
    const originalText = saveBtn.textContent;
    saveBtn.textContent = "⏳ Saving...";
    saveBtn.disabled = true;
    
    // Simulate save
    setTimeout(() => {
        // Show success
        document.getElementById('saveSuccess').style.display = 'block';
        
        // Clear form
        document.getElementById('author').value = '';
        document.getElementById('content').value = '';
        
        // Restore button
        saveBtn.textContent = originalText;
        saveBtn.disabled = false;
        
        // Hide success message after 3 seconds
        setTimeout(() => {
            document.getElementById('saveSuccess').style.display = 'none';
        }, 3000);
        
        // Log to console
        console.log("Content saved:", {
            type: contentType,
            author: author,
            content: content.substring(0, 50) + "...",
            timestamp: new Date().toLocaleString()
        });
        
    }, 1500);
}

// Enter key support
document.getElementById('password').addEventListener('keypress', function(e) {
    if(e.key === 'Enter') login();
});

// Auto-focus on username
window.onload = function() {
    document.getElementById('username').focus();
};
</script>

</body>
</html>
