<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUFISM Admin</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            width: 300px;
        }
        
        h2 {
            color: #4CAF50;
            text-align: center;
        }
        
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        
        button {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .message {
            text-align: center;
            margin-top: 10px;
            color: red;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>SUFISM ADMIN</h2>
    
    <input type="text" id="user" placeholder="Username" value="admin">
    
    <input type="password" id="pass" placeholder="Password" value="sufism123">
    
    <button onclick="checkLogin()">LOGIN</button>
    
    <div class="message" id="msg"></div>
</div>

<script>
function checkLogin() {
    var username = document.getElementById('user').value;
    var password = document.getElementById('pass').value;
    var msg = document.getElementById('msg');
    
    console.log("Username:", username);
    console.log("Password:", password);
    
    if(username === "admin" && password === "sufism123") {
        msg.innerHTML = "✅ Login successful! Redirecting...";
        msg.style.color = "green";
        
        // Redirect to admin panel
        setTimeout(function() {
            window.location.href = "admin-panel.html";
        }, 1000);
        
    } else {
        msg.innerHTML = "❌ Wrong username or password!";
        msg.style.color = "red";
    }
}
</script>

</body>
</html>
