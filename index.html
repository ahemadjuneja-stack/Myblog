<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUFISM Admin Panel</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Password Protection -->
    <script>
    window.onload = function() {
        const password = prompt("🔐 Enter Admin Password to Continue:");
        
        // SET YOUR PASSWORD HERE
        const ADMIN_PASSWORD = "Sufism123"; // 👈 ये बदलें अपने password से
        
        if (password === ADMIN_PASSWORD) {
            document.body.style.display = "block";
            console.log("✅ Admin access granted");
        } else {
            alert("❌ Access Denied!");
            window.location.href = "index.html";
        }
    };
    </script>
</head>
<body style="display: none;">

<div class="container">
    <h1><i class="fas fa-user-shield"></i> SUFISM Admin Panel</h1>
    
    <div class="admin-section">
        <h2><i class="fas fa-plus-circle"></i> Add New Content</h2>
        
        <div class="admin-form">
            <div class="form-group">
                <label>Content Type:</label>
                <select id="contentType">
                    <option value="quote">Sufi Quote</option>
                    <option value="poem">Sufi Poem</option>
                    <option value="article">Article</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Title/Author:</label>
                <input type="text" id="title" placeholder="e.g., Rumi, Kabir, etc.">
            </div>
            
            <div class="form-group">
                <label>Content:</label>
                <textarea id="content" rows="5" placeholder="Enter the quote, poem or article..."></textarea>
            </div>
            
            <div class="form-group">
                <label>Language:</label>
                <select id="language">
                    <option value="hindi">Hindi</option>
                    <option value="urdu">Urdu</option>
                    <option value="english">English</option>
                    <option value="arabic">Arabic</option>
                </select>
            </div>
            
            <button onclick="submitContent()" class="btn-submit">
                <i class="fas fa-upload"></i> Submit to Database
            </button>
        </div>
    </div>
    
    <div class="admin-info">
        <h3><i class="fas fa-info-circle"></i> Admin Instructions</h3>
        <ul>
            <li>Use this panel to add Sufi content to the website</li>
            <li>All content will be saved to Firebase database</li>
            <li>Changes will appear on the main website immediately</li>
            <li>Keep your admin password secure</li>
        </ul>
    </div>
</div>

<script>
// Your Firebase config (same as index.html)
async function submitContent() {
    const type = document.getElementById('contentType').value;
    const title = document.getElementById('title').value;
    const content = document.getElementById('content').value;
    const language = document.getElementById('language').value;
    
    if (!title || !content) {
        alert("Please fill all fields!");
        return;
    }
    
    // Show loading
    alert("📤 Submitting to database...");
    
    // Here you would add Firebase code to save data
    // For now, just show success
    alert("✅ Content submitted successfully!");
    
    // Clear form
    document.getElementById('title').value = '';
    document.getElementById('content').value = '';
}
</script>

</body>
</html>
