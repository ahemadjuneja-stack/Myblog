<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUFISM Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        
        .login-box h1 {
            color: #4CAF50;
            margin-bottom: 30px;
            font-size: 24px;
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .login-btn:hover {
            background: #45a049;
        }
        
        .error {
            color: red;
            margin-top: 10px;
            display: none;
        }
        
        .success {
            color: green;
            margin-top: 10px;
        }
        
        .admin-panel {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 800px;
            margin: 20px auto;
        }
        
        .logout-btn {
            background: red;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div id="loginContainer">
    <div class="login-box">
        <h1>🔐 SUFISM ADMIN LOGIN</h1>
        
        <div class="input-group">
            <label>Username:</label>
            <input type="text" id="username" placeholder="Enter username">
        </div>
        
        <div class="input-group">
            <label>Password:</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>
        
        <button class="login-btn" onclick="login()">LOGIN</button>
        
        <div class="error" id="errorMsg">❌ Wrong username or password!</div>
        
        <div class="success" id="successMsg" style="display: none;">✅ Login successful!</div>
        
        <div style="margin-top: 20px; color: #666; font-size: 14px;">
            <p><strong>Test Credentials:</strong></p>
            <p>Username: <strong>admin</strong></p>
            <p>Password: <strong>sufism123</strong></p>
        </div>
    </div>
</div>

<div class="admin-panel" id="adminPanel">
    <h1>🎉 WELCOME TO ADMIN PANEL</h1>
    <p>You have successfully logged in!</p>
    
    <div style="margin: 30px 0;">
        <h3>Add New Content:</h3>
        <input type="text" placeholder="Content Title" style="width: 100%; padding: 10px; margin: 10px 0;">
        <textarea placeholder="Content Description" style="width: 100%; padding: 10px; height: 100px; margin: 10px 0;"></textarea>
        <button style="padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 5px;">Save Content</button>
    </div>
    
    <button class="logout-btn" onclick="logout()">LOGOUT</button>
</div>

<script>
// ✅ SIMPLE LOGIN SYSTEM
const CORRECT_USERNAME = "admin";
const CORRECT_PASSWORD = "sufism123"; // All lowercase, no @

function login() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    
    // Clear previous messages
    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';
    
    // Convert to lowercase for case-insensitive check
    const inputUsername = username.toLowerCase().trim();
    const inputPassword = password.toLowerCase().trim();
    
    console.log("Trying login:", inputUsername, inputPassword);
    console.log("Expected:", CORRECT_USERNAME, CORRECT_PASSWORD);
    
    if (inputUsername === CORRECT_USERNAME && inputPassword === CORRECT_PASSWORD) {
        // Login Success
        successMsg.style.display = 'block';
        errorMsg.style.display = 'none';
        
        // Hide login, show admin panel
        setTimeout(() => {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
        }, 1000);
        
    } else {
        // Login Failed
        errorMsg.style.display = 'block';
        successMsg.style.display = 'none';
        
        // Clear password field
        document.getElementById('password').value = '';
    }
}

function logout() {
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('loginContainer').style.display = 'block';
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('successMsg').style.display = 'none';
}

// Allow Enter key to login
document.getElementById('password').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        login();
    }
});

// Auto-focus on username
window.onload = function() {
    document.getElementById('username').focus();
};
</script>

</body>
</html>
